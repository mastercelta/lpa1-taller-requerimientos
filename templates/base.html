<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Reservas de Hoteles</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('index') }}">Inicio</a>
    <a href="{{ url_for('buscar') }}">Buscar</a>
    <a href="{{ url_for('mis_reservas') }}">Mis reservas</a>
    <a href="{{ url_for('ofertas_temporadas') }}">Ofertas y temporadas</a>
    <a href="{{ url_for('registrar_hotel') }}">Registrar hotel</a>
    <a href="{{ url_for('registrar_habitacion') }}">Registrar habitación</a>
    <a href="{{ url_for('registrar_cliente') }}">Registrar cliente</a>
</nav>
<main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}
            <div class="flash {{ categoria }}">{{ mensaje }}</div>
        {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
</main>
</body>
</html>
